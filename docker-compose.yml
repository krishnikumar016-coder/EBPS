version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: burnout_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: burnout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d burnout_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend API Service
  fastapi_app:
    build: .
    container_name: burnout_fastapi
    restart: always
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres_db:5432/burnout_db
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./processed_data:/app/processed_data
      - ./plots:/app/plots

  # 3. Streamlit Analytics & HR Dashboard Service
  streamlit_app:
    build: .
    container_name: burnout_streamlit
    restart: always
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres_db:5432/burnout_db
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
